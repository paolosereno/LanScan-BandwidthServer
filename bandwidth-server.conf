[Server]
# TCP listening port (default: 5201)
tcp_port=5201

# UDP listening port (default: 5201)
udp_port=5201

# Maximum concurrent connections (default: 10)
max_connections=10

# Buffer size in bytes (default: 64 KB)
buffer_size=65536

# Maximum test duration in seconds (default: 60)
max_test_duration=60

[Logging]
# Log level: DEBUG, INFO, WARNING, ERROR (default: INFO)
log_level=INFO

# Log file path (empty = console only)
log_file=bandwidth-server.log

[Security]
# Enable rate limiting per IP address (default: true)
enable_rate_limiting=true

# Maximum requests per IP in time window (default: 5)
max_requests_per_ip=5

# Rate limiting time window in seconds (default: 60)
request_window_seconds=60
